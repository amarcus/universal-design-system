<div part="checkbox-container" class="checkbox-container">
    <input part="checkbox" type="checkbox" class="input">
    <span part="checkmark" class="checkmark"></span>

    <div part="content" class="content">
        <label part="label-wrapper" class="label-wrapper">
            <span part="label" class="label">
                <slot></slot>
            </span>

            <span part="counter" class="counter"></span>

            <span class="icon-right" part="icon-right">
                <slot name="icon-right"></slot>
            </span>
        </label>

        <div part="description" class="description"></div>
    </div>
</div>
