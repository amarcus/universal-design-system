<label part="toggle" class="toggle">
    <input part="input" type="checkbox" role="switch" class="input">

    <div part="switch-wrapper" class="switch-wrapper">
        <span part="switch" class="switch" aria-hidden="true">
            <span part="thumb" class="thumb"></span>
        </span>
    </div>

    <div part="content" class="content">
        <div part="wrapper" class="wrapper">
            <span part="label" class="label">
                <slot></slot>
            </span>

            <span part="counter" class="counter"></span>

            <span part="icon-right" class="icon-right">
                <slot name="icon-right"></slot>
            </span>
        </div>

        <div part="description" class="description"></div>
    </div>
</label>
